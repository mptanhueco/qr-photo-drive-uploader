<!doctype html>
<html><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#242b38;background:#f4f6fb}*{box-sizing:border-box}body{margin:0;padding:26px 15px}.wrap{max-width:490px;margin:0 auto;background:white;border-radius:22px;box-shadow:0 15px 55px #18233b15;overflow:hidden}.hero{background:linear-gradient(125deg,#2d507b,#799dc0);color:white;text-align:center;padding:40px 20px}.hero .emoji{font-size:42px}.hero h1{margin:12px 0 7px;font-size:29px}.hero p{margin:0;opacity:.9;font-size:14px}.content{padding:24px}.btn{width:100%;border:0;border-radius:13px;padding:17px;font-size:16px;font-weight:700;cursor:pointer;margin:0 0 12px;background:#284e79;color:white}.btn.alt{background:#edf3fa;color:#254c77}.btn:disabled{opacity:.5;cursor:not-allowed}.hint{font-size:12px;color:#697587;text-align:center;margin:5px 0 20px}.status{white-space:pre-line;font-size:14px;background:#f3f6fa;border-radius:12px;padding:13px;min-height:45px}.bar{height:9px;background:#e9eef5;border-radius:20px;overflow:hidden;margin:12px 0}.fill{height:100%;width:0;background:#37856e;transition:width .2s}.footer{text-align:center;font-size:11px;color:#8893a2;padding:0 20px 22px}input[type=file]{display:none}
</style></head><body><main class="wrap"><header class="hero"><div class="emoji">📸</div><h1>Capture the Memories</h1><p>Share your favorite moments with us.</p></header><section class="content"><button class="btn" id="cameraBtn" onclick="document.getElementById('camera').click()">📷 Take a Photo</button><button class="btn alt" id="galleryBtn" onclick="document.getElementById('gallery').click()">▧ Choose From Gallery</button><p class="hint">Photos upload after you select them. Up to 10 per selection; 8 MB each. For best compatibility, use JPEG photos.</p><input id="camera" type="file" accept="image/*" capture="environment"><input id="gallery" type="file" accept="image/*" multiple><form id="uploadForm"><input id="photo" name="photo" type="file" accept="image/*"></form><div class="status" id="status" role="status" aria-live="polite">Ready to capture your memories.</div><div class="bar"><div class="fill" id="fill"></div></div></section><div class="footer">Your photos are sent to the event organizer's private Google Drive folder.</div></main>
<script>
const MAX=8*1024*1024, TYPES=['image/jpeg','image/png','image/webp','image/heic','image/heif'];let busy=false;
const status=document.getElementById('status'),fill=document.getElementById('fill');
function setBusy(value){busy=value;document.getElementById('cameraBtn').disabled=value;document.getElementById('galleryBtn').disabled=value;}
for(const id of ['camera','gallery'])document.getElementById(id).addEventListener('change',async function(){const items=[...this.files];this.value='';if(!items.length)return;if(busy){status.textContent='An upload is already in progress.';return}if(items.length>10){status.textContent='Please select 10 photos or fewer at once.';return}setBusy(true);let ok=0,fail=0;fill.style.width='0%';for(let i=0;i<items.length;i++){const file=items[i];status.textContent=`Uploading ${i+1} of ${items.length}: ${file.name}`;try{if(!TYPES.includes(file.type))throw Error('Unsupported image type');if(!file.size||file.size>MAX)throw Error('File must be 8 MB or smaller');const transfer=new DataTransfer();transfer.items.add(file);document.getElementById('photo').files=transfer.files;await new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).uploadPhoto(document.getElementById('uploadForm')));ok++}catch(e){fail++;status.textContent=`Could not upload ${file.name}: ${e.message||e}`}fill.style.width=((i+1)/items.length*100)+'%'}status.textContent=`Finished! ${ok} photo(s) uploaded successfully.${fail?' '+fail+' failed. Try those again.':''}`;setBusy(false)});
</script></body></html>
